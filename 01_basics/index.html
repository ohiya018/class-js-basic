<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_basics</title>
</head>

<body>
    <h1>JavaScript基礎</h1>
    <p>開発者ツールのConsole（コンソール）を開いて結果を確認してください。</p>
    <script>
        // 1行コメント
        /*
        複数行コメント
        */
        console.log('Hello JavaScript!', 123);
        console.warn('warn');
        console.error('error');
        console.table(['apple', 'banana']);

        //変数宣言

        // const name = 'imaizumi';
        // // 箱を作る宣言と同時に値を代入しないとエラー
        // console.log(name);

        let name;
        // 箱だけ作る宣言ができる
        console.log(name);
        name = 'imaizumi';
        console.log(name);


        //演算子
        console.log(6 + 9);
        console.log(10 - 15);
        console.log(3 * 7);
        console.log(10 / 5);
        console.log(7 % 3);
        console.log(3 ** 2);

        let x = 1;
        x = x + 1;
        /*
        x+1だけでは変数の値は変わらない
        必ず、計算した結果を代入する必要がある
        */
        console.log(x);

        // 自己代入演算子
        x += 100;
        console.log(x);

        //インクリメント
        x++;
        console.log(x);

        // デクリメント
        x--;
        console.log(x);

        //データ型
        console.log(typeof 'Hello');
        console.log(x + 'px');

        const person = `imaizumi`;
        const points = 120;
        console.log('こんにちは、${person}さん。点数は${points}です。');
    </script>
</body>

</html>
