<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_basics</title>
</head>

<body>
    <h1>JavaScript基礎</h1>
    <p>開発者ツールのConsole（コンソール）を開いて結果を確認してください。</p>
    <script>
        // 1行コメント
        /*
        複数行コメント
        */
        console.log('Hello JavaScript!', 123);
        console.warn('warn');
        console.error('error');
        console.table(['apple', 'banana']);

        //変数宣言

        // const name = 'imaizumi';
        // // 箱を作る宣言と同時に値を代入しないとエラー
        // console.log(name);

        let name;
        // 箱だけ作る宣言ができる
        console.log(name);
        name = 'imaizumi';
        console.log(name);
    </script>
</body>

</html>
